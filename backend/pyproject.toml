[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-supply-chain-mvp"
version = "0.1.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pymongo>=4.8,<5", "redis>=5,<6", "PyJWT>=2.9,<3", "passlib[bcrypt]>=1.7,<2", "pydantic-settings>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
