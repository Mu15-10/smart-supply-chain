[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-supply-chain-mvp"
version = "0.1.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pymongo>=4.8,<5", "redis>=5,<6", "PyJWT>=2.9,<3", "passlib[bcrypt]>=1.7,<2", "pydantic-settings>=2.6,<3", "alembic>=1.14,<2", "email-validator==2.4.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "postgres: test requires PostgreSQL via TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]
# FastAPI dependency injection intentionally calls Depends() in route signatures.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally use environment variables before importing the app.
"tests/*.py" = ["S101"]
