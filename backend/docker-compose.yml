services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: supply
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U supply -d supply"], interval: 5s, timeout: 5s, retries: 10}
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongodata:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  auth:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: [SERVICE=auth, ENVIRONMENT=development, DATABASE_URL=postgresql+psycopg://supply:supply@postgres:5432/supply, MONGO_URL=mongodb://mongo:27017, REDIS_URL=redis://redis:6379/0, JWT_SECRET=local-development-secret-change-before-shared-use-2026]
    ports: ["8001:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
  supplier:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: [SERVICE=supplier, ENVIRONMENT=development, DATABASE_URL=postgresql+psycopg://supply:supply@postgres:5432/supply, MONGO_URL=mongodb://mongo:27017, REDIS_URL=redis://redis:6379/0, JWT_SECRET=local-development-secret-change-before-shared-use-2026]
    ports: ["8002:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  inventory:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: [SERVICE=inventory, ENVIRONMENT=development, DATABASE_URL=postgresql+psycopg://supply:supply@postgres:5432/supply, MONGO_URL=mongodb://mongo:27017, REDIS_URL=redis://redis:6379/0, JWT_SECRET=local-development-secret-change-before-shared-use-2026]
    ports: ["8003:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
  order:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: [SERVICE=order, ENVIRONMENT=development, DATABASE_URL=postgresql+psycopg://supply:supply@postgres:5432/supply, MONGO_URL=mongodb://mongo:27017, REDIS_URL=redis://redis:6379/0, JWT_SECRET=local-development-secret-change-before-shared-use-2026]
    ports: ["8004:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
volumes: {pgdata: {}, mongodata: {}}
