services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supply}
      POSTGRES_USER: ${POSTGRES_USER:-supply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongodata:/data/db"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports: ["127.0.0.1:6379:6379"]
  auth:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      SERVICE: auth
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supply}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supply}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports: ["127.0.0.1:8001:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
  supplier:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      SERVICE: supplier
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supply}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supply}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports: ["127.0.0.1:8002:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
  inventory:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      SERVICE: inventory
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supply}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supply}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports: ["127.0.0.1:8003:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
  order:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    environment:
      SERVICE: order
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supply}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supply}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports: ["127.0.0.1:8004:8000"]
    depends_on: {postgres: {condition: service_healthy}, mongo: {condition: service_started}, redis: {condition: service_started}}
volumes: {pgdata: {}, mongodata: {}}
